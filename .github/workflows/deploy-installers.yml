# This workflow will build and release the SS application

name: Deploy Installers

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'version tag'
        required: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: set global environment variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV   
          else
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.TAG }}

      - name: setup java 17 with maven cache
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install Install4J
        run: |
          INSTALL4J_HOME=/opt/install4j10.0.5
          wget https://download.ej-technologies.com/install4j/install4j_unix_10_0_5.tar.gz
          tar -xvzf install4j_unix_10_0_5.tar.gz
          sudo mv install4j10.0.5 ${INSTALL4J_HOME}
          sudo chmod 777 -R ${INSTALL4J_HOME}
          echo "INSTALL4J_HOME=${INSTALL4J_HOME}" >> $GITHUB_ENV

      - name: Maven dependencies
        run: |
          mvn --batch-mode clean install dependency:copy-dependencies

      - name: Run Install4J
        run: |
          echo '${{ secrets.MAC_KEYSTORE }}' | base64 --decode > Apple_Dev_Id_Certificate_exp_20270924.p12
          export MAC_PASSWORD='${{ secrets.MAC_KEYSTORE_PASSWORD }}'
          
          echo '${{ secrets.WINDOWS_KEYSTORE }}' | base64 --decode > VCELL_UCONN_MS_2017.pfx
          export WINDOWS_PASSWORD='${{ secrets.WINDOWS_KEYSTORE_PASSWORD }}'
          
          export TAG=${{ env.TAG }}
          
          ./generate_client_installers.sh $(pwd) $(pwd) ${INSTALL4J_HOME}/bin/install4jc ${{ secrets.INSTALL4J_V10 }}

      # Hand the installers to the notarize job rather than releasing from here. The macOS
      # installer has to be notarized and stapled BEFORE it is published, or users download the
      # un-stapled one and Gatekeeper still refuses it.
      - name: upload generated installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installers
          retention-days: 1

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() }}

  notarize-and-release:
    name: Notarize the macOS installer, then publish the release
    runs-on: macos-latest
    needs: build
    steps:
      - name: set global environment variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.TAG }}

      - name: download generated installers
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers

      # Fail here rather than publishing something Gatekeeper will refuse. Silently skipping is
      # how the release ended up signed-but-not-notarized in the first place: the installer is
      # correctly signed, so nothing looks wrong until a user downloads it and macOS blocks it.
      - name: check notarization credentials are present
        run: |
          missing=""
          [ -z "${{ secrets.MAC_TEAM_ID }}" ] && missing="$missing MAC_TEAM_ID"
          [ -z "${{ secrets.MAC_ID }}" ]      && missing="$missing MAC_ID"
          [ -z "${{ secrets.MAC_PASSWORD }}" ] && missing="$missing MAC_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Cannot notarize: missing repository secret(s):$missing"
            echo "MAC_ID is the Apple ID, MAC_PASSWORD an app-specific password for it, and"
            echo "MAC_TEAM_ID the Developer Team ID (RZKH46R3ZM for the signing certificate)."
            exit 1
          fi

      - name: notarize and staple the mac installer
        run: |
          export MAC_INSTALLER=$(ls installers/*.dmg)
          echo "notarizing $MAC_INSTALLER"
          ./.github/mac_notarize.sh "${{ secrets.MAC_TEAM_ID }}" "${{ secrets.MAC_ID }}" "${{ secrets.MAC_PASSWORD }}" "${MAC_INSTALLER}"

      # Proof that the published artifact is the stapled one, in the build log.
      - name: verify Gatekeeper accepts the stapled installer
        run: |
          MAC_INSTALLER=$(ls installers/*.dmg)
          xcrun stapler validate "$MAC_INSTALLER"
          MP=$(hdiutil attach "$MAC_INSTALLER" -nobrowse -readonly | tail -1 | awk '{$1="";$2="";sub(/^ */,"");print}')
          spctl -a -vvv -t exec "$MP"/*.app
          hdiutil detach "$MP" -quiet

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body: Automated release of installers for version ${{ env.TAG }}
          draft: false
          prerelease: false
          files: |
            installers/*

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() }}
